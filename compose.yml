services:
  api:
    build: .
    cpus: "${OPTIMIZER_CPU_LIMIT:-2.0}"
    command: >
      uvicorn app.main:app
      --host 0.0.0.0
      --port 8080
      --reload
    ports:
      - "8080:8080"
    volumes:
      - ./app:/app/app
    env_file:
      - .env
    environment:
      OPTIMIZER_CPU_LIMIT: "${OPTIMIZER_CPU_LIMIT:-2.0}"
      ORTOOLS_NUM_SEARCH_WORKERS: "${ORTOOLS_NUM_SEARCH_WORKERS:-2}"
      ORTOOLS_RANDOM_SEED: "${ORTOOLS_RANDOM_SEED:-1}"
